<style>

adius:50%;display:grid;place-items:center;color:#0f5099;font-weight:800}.btn{border:none;background:var(--primary);color:white;padding:11px 15px;border-radius:10px;font-size:13px;font-weight:800;white-space:nowrap;min-height:41px}.btn:hover{filter:brightness(1.07)}.btn.out{color:var(--primary);background:white;border:1px solid #c8d9ec}.btn.soft{background:#e5f0fe;color:#105197}.btn.danger{background:#fff1f1;color:#a52d31}.btn.sm{min-height:31px;padding:7px 9px;font-size:12px}.btn:focus-visible,.nav button:focus-visible{outline:3px solid #7fb8ff}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #e0e8f2;border-radius:16px;padding:19px;box-shadow:0 3px 12px #173b6608}.metric{position:relative;min-height:131px}.metric .mini{height:34px;width:34px;border-radius:10px;background:#e7f1ff;display:grid;place-items:center;font-size:19px;margin-bottom:11px}.metric .caption{color:#60748a;font-size:12px;font-weight:700}.metric strong{font-size:23px;margin-top:6px;display:block;letter-spacing:-.5px;word-break:break-word}.metric.green strong{color:#0c8760}.metric.red strong{color:#bd3e4e}.toolbar,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.sectionTitle{margin:25px 0 12px}.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);gap:16px}.notice{background:#e7f1ff;border:1px solid #cadef4;color:#285378;padding:13px 16px;border-radius:11px;font-size:12px;line-height:1.5;margin:18px 0}.tableWrap{overflow-x:auto}.table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}.table th{color:#688097;font-weight:750;background:#f8fafc;font-size:12px;padding:12px 10px}.table td{padding:13px 10px;border-top:1px solid #ecf0f4;vertical-align:middle}.table th,.table td{white-space:nowrap}.table td.wide{white-space:normal;min-width:175px}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#ebf2fa;color:#3d6285;font-weight:800;font-size:11px}.tag.green{background:#dcf8e9;color:#117548}.tag.yellow{background:#fff2d0;color:#997010}.tag.red{background:#ffebeb;color:#b44242}.table .btn{margin-right:3px}.empty{text-align:center;padding:32px;color:#8495a7}.empty .symbol{font-size:33px;margin-bottom:8px}.fieldGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fieldGrid .full{grid-column:1/-1}.search{max-width:310px}.list{display:grid;gap:10px}.item{padding:12px 0;border-bottom:1px solid #ecf0f4;display:flex;align-items:center;gap:10px;justify-content:space-between}.item:last-child{border:0}.item small{display:block;margin-top:5px;font-size:11px}.bold{font-weight:800}.modalShade{position:fixed;inset:0;background:#071c37b0;z-index:50;display:flex;align-items:center;justify-content:center;padding:15px;overflow-y:auto}.modal{width:min(660px,100%);max-height:94vh;overflow-y:auto;background:white;border-radius:18px;box-shadow:0 16px 50px #0b20334f;padding:23px}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.x{border:0;background:#f0f4f8;border-radius:8px;font-size:21px;width:35px;height:35px}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:18px}.editorItems{border:1px solid #dde8f3;border-radius:10px;padding:10px;display:grid;gap:9px}.editorRow{display:grid;grid-template-columns:minmax(80px,2fr) 70px 95px 35px;gap:6px;align-items:center}.editorRow input{padding:8px;font-size:14px}.login{max-width:390px;margin:7vh auto;padding:24px}.loginlogo{width:90px;height:90px;background:var(--dark);border-radius:25px;display:grid;place-items:center;margin:0 auto 18px}.loginlogo svg{width:65px}.login h1{text-align:center}.login p{text-align:center;margin:8px 0 22px;color:#617993;font-size:14px}.login form{display:grid;gap:14px}.login footer{text-align:center;color:#8c9db0;font-size:11px;line-height:1.5;margin-top:20px}.bar{height:8px;background:#e3eaf4;border-radius:50px;overflow:hidden;margin-top:9px}.bar span{height:100%;display:block;background:var(--blue);border-radius:50px}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.minirow{font-size:13px;padding:12px 0;border-bottom:1px solid #eef2f6;display:flex;justify-content:space-between;gap:8px}.minirow:last-child{border:0}.printArea{display:none}.bottomNav{display:none}.toast{position:fixed;z-index:200;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;background:#092d53;color:#fff;font-size:13px;font-weight:700;box-shadow:0 10px 30px #0005;max-width:90vw}.ident{padding:11px;background:#f5f9ff;border:1px solid #e0ebf6;border-radius:11px;font-size:12px;color:#567}
@media(max-width:900px){.side{width:76px;padding:19px 8px}.side .brand{margin:0 9px 26px}.side .brand div,.nav .label,.sideBottom{display:none}.nav button{justify-content:center;padding:13px 8px}.main{padding:24px 18px 100px}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:650px){.side{display:none}.main{padding:16px 13px 105px}.top{margin-bottom:19px}.top h1{font-size:22px}.grid4{gap:9px}.metric{min-height:118px;padding:13px}.metric .mini{width:28px;height:28px;font-size:15px;margin-bottom:8px}.metric strong{font-size:20px}.card{padding:14px}.two{gap:10px}.toolbar{align-items:flex-start}.toolbar .btn{flex:1}.fieldGrid{gap:10px}.bottomNav{position:fixed;z-index:15;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #dce6f0;padding:8px max(4px,env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom))}.bottomNav button{font-size:10px;display:grid;place-items:center;gap:2px;border:0;background:transparent;color:#5e7189;font-weight:750;min-width:46px;padding:4px 3px}.bottomNav button.active{color:var(--primary)}.bottomNav button i{font-size:21px;font-style:normal}.modalShade{align-items:flex-end;padding:0}.modal{border-radius:17px 17px 0 0;max-height:94vh;padding:18px 14px 28px}.search{max-width:100%}.editorRow{grid-template-columns:minmax(55px,2fr) 50px 80px 31px;gap:4px}.editorRow input{padding:7px 4px}.editorItems{padding:7px}.login{margin:4vh auto}}

</style></head><body><div id="app"></div><div id="printArea" class="printArea"></div><script>
(()=>{'use strict';
const KEY='thiago_reis_v1',SESSION='thiago_reis_session';
const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,8);
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const dateFmt=s=>s?String(s).split('-').reverse().join('/'): '—';
const n=s=>Math.max(0,Number(String(s||0).replace(',','.'))||0);
function blank(){return{version:1,clients:[],quotes:[],jobs:[],expenses:[],incomes:[],settings:{company:'Thiago Reis',phone:'14996600996',city:'Iacanga - SP e região',commission:40,ownerPin:'',employeePin:''}}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||blank();}catch(e){db=blank()}
for(const k of ['clients','quotes','jobs','expenses','incomes'])if(!Array.isArray(db[k]))db[k]=[];
db.settings={...blank().settings,...(db.settings||{})};
let current=(()=>{try{return sessionStorage.getItem(SESSION)}catch(e){return null}})();
let page='inicio',filter='',modal=null,editing=null,quoteRows=[],toastTimer=null;
const app=document.getElementById('app');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notify('Não foi possível salvar. Faça backup dos dados.');return false}};
function notify(t){let old=document.querySelector('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),3300)}
function logo(){return `<svg viewBox="0 0 64 64" aria-label="Marca Thiago Reis" role="img"><rect width="64" height="64" rx="15" fill="#1576DB"/><path d="M34 7 17 35h14l-5 22 23-33H34l6-17z" fill="#fff"/><circle cx="48" cy="46" r="10" fill="#062957" stroke="#fff" stroke-width="3"/><circle cx="48" cy="46" r="4" fill="#4db7ff"/></svg>`}
const menu=[['inicio','⌂','Início'],['clientes','♙','Clientes'],['orcamentos','▤','Orçamentos'],['servicos','⚡','Serviços'],['agenda','▦','Agenda'],['financeiro','◈','Financeiro'],['gastos','▣','Gastos'],['ajustes','⚙','Configurações']];
const allowed=()=>current==='dono'?menu:menu.filter(x=>['inicio','clientes','servicos','agenda'].includes(x[0]));
const title=id=>({inicio:'Visão geral',clientes:'Clientes',orcamentos:'Orçamentos',servicos:'Ordens de serviço',agenda:'Agenda de serviços',financeiro:'Financeiro',gastos:'Gastos da empresa',ajustes:'Configurações'})[id]||'Thiago Reis';
function navHTML(){return allowed().map(([id,icon,txt])=>`<button data-page="${id}" class="${page===id?'active':''}"><i>${icon}</i><span class="label">${txt}</span></button>`).join('')}
function draw(){if(!db.settings.ownerPin){app.innerHTML=setupHTML();bindSetup();return}if(!current){app.innerHTML=loginHTML();bindLogin();return}if(!allowed().some(x=>x[0]===page))page='inicio';app.innerHTML=`<div class="wrap"><aside class="side"><div class="brand">${logo()}<div><strong>THIAGO REIS</strong><span>ELÉTRICA & CÂMERAS</span></div></div><nav class="nav">${navHTML()}</nav><div class="sideBottom">Gerencie seu negócio ✦</div></aside><main class="main"><header class="top"><div><h1>${title(page)}</h1><p class="muted">${current==='dono'?'Painel do proprietário':'Acesso do funcionário'} • ${dateFmt(today())}</p></div><div class="topR"><button class="btn out sm" id="logout">Sair</button><div class="avatar">${current==='dono'?'TR':'F'}</div></div></header>${content()}</main></div><nav class="bottomNav">${allowed().filter(x=>['inicio','clientes','orcamentos','servicos','financeiro'].includes(x[0])).map(([id,icon,txt])=>`<button data-page="${id}" class="${page===id?'active':''}"><i>${icon}</i><span>${txt}</span></button>`).join('')}</nav>`;bindMain()}
function setupHTML(){return `<div class="login card"><div class="loginlogo">${logo()}</div><h1>THIAGO REIS</h1><p>Elétrica predial e instalação de câmeras</p><h3>Primeiro acesso</h3><p style="text-align:left">Crie as senhas locais para você e seu ajudante. Este modo funciona neste aparelho, sem sincronização.</p><form id="setup"><label>Senha do proprietário (mínimo 6 dígitos)<input id="ownerPin" type="password" inputmode="numeric" pattern="[0-9]{6,}" minlength="6" required></label><label>Senha do funcionário (mínimo 6 dígitos)<input id="employeePin" type="password" inputmode="numeric" pattern="[0-9]{6,}" minlength="6" required></label><button class="btn">Começar</button></form><footer>Salve suas senhas. Para usar em celulares diferentes com dados compartilhados, será preciso publicar com banco de dados e autenticação online.</footer></div>`}
function loginHTML(){return `<div class="login card"><div class="loginlogo">${logo()}</div><h1>THIAGO REIS</h1><p>Controle de clientes, serviços e financeiro</p><form id="login"><label>Acesso<select id="role"><option value="dono">Proprietário</option><option value="funcionario">Funcionário</option></select></label><label>Senha<input id="pin" type="password" inputmode="numeric" autocomplete="off" required></label><button class="btn">Entrar no sistema</button></form><footer>Dados armazenados neste navegador. Faça backup em Configurações. A senha local não substitui autenticação segura em servidor.</footer></div>`}
function bindSetup(){document.getElementById('setup').addEventListener('submit',e=>{e.preventDefault();const a=document.getElementById('ownerPin').value,b=document.getElementById('employeePin').value;if(!/^\d{6,}$/.test(a)||!/^\d{6,}$/.test(b)||a===b)return notify('Use senhas diferentes, com pelo menos 6 números.');db.settings.ownerPin=a;db.settings.employeePin=b;save();current='dono';try{sessionStorage.setItem(SESSION,current)}catch(e){}draw()})}
function bindLogin(){document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();let role=document.getElementById('role').value,pin=document.getElementById('pin').value;if(pin!==db.settings[role==='dono'?'ownerPin':'employeePin'])return notify('Senha incorreta.');current=role;try{sessionStorage.setItem(SESSION,role)}catch(e){}draw()})}
const C=id=>db.clients.find(x=>x.id===id);
const clientName=id=>C(id)?.name||'Sem cliente';
const jobRevenue=j=>n(j.price);
const jobLabor=j=>n(j.labor??j.price);
const jobCommission=j=>jobLabor(j)*n(j.rate??db.settings.commission)/100;
const totalQuote=q=>(q.items||[]).reduce((a,i)=>a+n(i.qty)*n(i.price),0)-n(q.discount);
const isOwner=()=>current==='dono';
const M=(v)=>money(v);
function stats(){let paid=db.incomes.reduce((a,x)=>a+n(x.amount),0),exp=db.expenses.reduce((a,x)=>a+n(x.amount),0),open=db.jobs.filter(x=>x.payStatus!=='pago').reduce((a,x)=>a+n(x.price),0),com=db.jobs.filter(x=>x.payStatus==='pago').reduce((a,x)=>a+jobCommission(x),0);return{paid,exp,open,com,balance:paid-exp-com}}
function content(){switch(page){case 'inicio':return home();case 'clientes':return clients();case 'orcamentos':return quotes();case 'servicos':return jobs();case 'agenda':return agenda();case 'financeiro':return finance();case 'gastos':return expenses();case 'ajustes':return settings();default:return home()}}
const empty=msg=>`<div class="empty"><div class="symbol">▢</div>${msg}</div>`;
function home(){let s=stats(),upcoming=[...db.jobs].filter(x=>x.date>=today()&&x.status!=='concluido').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5),recent=db.jobs.slice(-5).reverse();return `<div class="grid4"><div class="card metric"><div class="mini">☑</div><div class="caption">Serviços cadastrados</div><strong>${db.jobs.length}</strong></div><div class="card metric green"><div class="mini">↗</div><div class="caption">Entradas registradas</div><strong>${M(s.paid)}</strong></div>${isOwner()?`<div class="card metric red"><div class="mini">↘</div><div class="caption">Despesas</div><strong>${M(s.exp)}</strong></div><div class="card metric"><div class="mini">◷</div><div class="caption">A receber</div><strong>${M(s.open)}</strong></div>`:`<div class="card metric"><div class="mini">♙</div><div class="caption">Clientes</div><strong>${db.clients.length}</strong></div><div class="card metric"><div class="mini">▦</div><div class="caption">Agendados</div><strong>${upcoming.length}</strong></div>`}</div><div class="toolbar sectionTitle"><h2>Acesso rápido</h2></div><div class="row"><button class="btn" data-new="job">+ Novo serviço</button><button class="btn soft" data-new="client">+ Novo cliente</button>${isOwner()?'<button class="btn soft" data-new="quote">+ Novo orçamento</button><button class="btn soft" data-new="expense">+ Registrar gasto</button>':''}</div><div class="two sectionTitle"><div class="card"><div class="row"><h3>Próximos atendimentos</h3><button class="btn sm out" data-go="agenda">Ver agenda</button></div><div class="list">${upcoming.length?upcoming.map(j=>`<div class="item"><div><b>${esc(clientName(j.clientId))}</b><small>${dateFmt(j.date)} • ${esc(j.desc)}</small></div><span class="tag">${esc(j.status)}</span></div>`).join(''):empty('Nenhum atendimento agendado.')}</div></div><div class="card"><h3>Resumo da operação</h3><div class="minirow"><span>Clientes</span><b>${db.clients.length}</b></div><div class="minirow"><span>Orçamentos</span><b>${db.quotes.length}</b></div><div class="minirow"><span>Serviços finalizados</span><b>${db.jobs.filter(j=>j.status==='concluido').length}</b></div>${isOwner()?`<div class="minirow"><span>Comissão a pagar (serviços recebidos)</span><b>${M(s.com)}</b></div><div class="minirow"><span>Saldo após gastos e comissão</span><b>${M(s.balance)}</b></div>`:''}</div></div><div class="notice">🔒 Os dados ficam salvos neste navegador. Para proteger seu histórico, exporte um backup regularmente em Configurações. Acesso simultâneo em aparelhos diferentes exige servidor.</div>`}
function searchBar(){return `<input id="search" class="search" value="${esc(filter)}" placeholder="Buscar por nome ou descrição" aria-label="Pesquisar">`}
function clients(){let arr=db.clients.filter(x=>(x.name+' '+x.phone+' '+x.address).toLowerCase().includes(filter.toLowerCase())).slice().reverse();return `<div class="toolbar"><h2>${db.clients.length} clientes</h2><button class="btn" data-new="client">+ Novo cliente</button></div><div class="sectionTitle">${searchBar()}</div><div class="card tableWrap">${arr.length?`<table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>Cidade / endereço</th><th>Ações</th></tr></thead><tbody>${arr.map(c=>`<tr><td class="bold">${esc(c.name)}</td><td>${esc(c.phone||'—')}</td><td class="wide">${esc(c.address||'—')}</td><td><button class="btn sm out" data-edit="client:${c.id}">Editar</button>${c.phone?`<a class="btn sm soft" style="text-decoration:none;display:inline-block" href="https://wa.me/55${String(c.phone).replace(/\D/g,'')}" target="_blank" rel="noopener">WhatsApp</a>`:''}</td></tr>`).join('')}</tbody></table>`:empty('Nenhum cliente encontrado.')}</div>`}
function quotes(){let arr=db.quotes.filter(q=>(clientName(q.clientId)+' '+q.title).toLowerCase().includes(filter.toLowerCase())).slice().reverse();return `<div class="toolbar"><h2>${db.quotes.length} orçamentos</h2><button class="btn" data-new="quote">+ Criar orçamento</button></div><div class="sectionTitle">${searchBar()}</div><div class="card tableWrap">${arr.length?`<table class="table"><thead><tr><th>Número</th><th>Cliente</th><th>Descrição</th><th>Valor</th><th>Situação</th><th>Ações</th></tr></thead><tbody>${arr.map(q=>`<tr><td>#${esc(q.number)}</td><td>${esc(clientName(q.clientId))}</td><td class="wide">${esc(q.title)}</td><td class="bold">${M(totalQuote(q))}</td><td><span class="tag ${q.status==='aprovado'?'green':q.status==='recusado'?'red':'yellow'}">${esc(q.status)}</span></td><td><button class="btn sm out" data-print="${q.id}">PDF</button><button class="btn sm soft" data-edit="quote:${q.id}">Editar</button></td></tr>`).join('')}</tbody></table>`:empty('Nenhum orçamento encontrado.')}</div><p class="muted" style="font-size:12px;margin-top:12px">Toque em PDF para imprimir ou salvar o orçamento como PDF no iPhone.</p>`}
function jobs(){let arr=db.jobs.filter(j=>(clientName(j.clientId)+' '+j.desc).toLowerCase().includes(filter.toLowerCase())).slice().reverse();return `<div class="toolbar"><h2>${db.jobs.length} serviços</h2><button class="btn" data-new="job">+ Novo serviço</button></div><div class="sectionTitle">${searchBar()}</div><div class="card tableWrap">${arr.length?`<table class="table"><thead><tr><th>Data</th><th>Cliente</th><th>Serviço</th>${isOwner()?'<th>Valor</th>':''}<th>Status</th><th>Ações</th></tr></thead><tbody>${arr.map(j=>`<tr><td>${dateFmt(j.date)}</td><td>${esc(clientName(j.clientId))}</td><td class="wide">${esc(j.desc)}</td>${isOwner()?`<td>${M(j.price)}</td>`:''}<td><span class="tag ${j.status==='concluido'?'green':'yellow'}">${esc(j.status)}</span></td><td><button class="btn sm out" data-edit="job:${j.id}">Editar</button>${isOwner()&&j.payStatus!=='pago'?`<button class="btn sm soft" data-paid="${j.id}">Receber</button>`:''}</td></tr>`).join('')}</tbody></table>`:empty('Nenhum serviço cadastrado.')}</div>`}
function agenda(){let grouped=[...db.jobs].filter(j=>j.date).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="toolbar"><h2>Agenda de atendimentos</h2><button class="btn" data-new="job">+ Agendar serviço</button></div><div class="card sectionTitle">${grouped.length?grouped.map(j=>`<div class="item"><div><b>${dateFmt(j.date)} — ${esc(clientName(j.clientId))}</b><small>${esc(j.desc)} • ${esc(j.status)}</small></div><button class="btn sm out" data-edit="job:${j.id}">Abrir</button></div>`).join(''):empty('Nenhuma visita marcada.')}</div>`}
function finance(){let s=stats();let entries=[...db.incomes.map(x=>({...x,kind:'entrada'})),...db.expenses.map(x=>({...x,kind:'saída'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,80);return `<div class="grid4"><div class="card metric green"><div class="mini">↗</div><div class="caption">Entradas</div><strong>${M(s.paid)}</strong></div><div class="card metric red"><div class="mini">↘</div><div class="caption">Gastos</div><strong>${M(s.exp)}</strong></div><div class="card metric"><div class="mini">♙</div><div class="caption">40% / ajudante*</div><strong>${M(s.com)}</strong></div><div class="card metric"><div class="mini">▣</div><div class="caption">Saldo estimado</div><strong>${M(s.balance)}</strong></div></div><div class="notice">* Comissão calculada sobre a mão de obra dos serviços marcados como recebidos. Saldo = entradas - despesas - comissão. Os lançamentos são manuais, sem ligação com banco. Não representa contabilidade fiscal.</div><div class="toolbar sectionTitle"><h2>Movimentações</h2><div class="row"><button class="btn soft" data-new="income">+ Entrada avulsa</button><button class="btn" data-new="expense">+ Despesa</button></div></div><div class="card tableWrap">${entries.length?`<table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Ações</th></tr></thead><tbody>${entries.map(x=>`<tr><td>${dateFmt(x.date)}</td><td><span class="tag ${x.kind==='entrada'?'green':'red'}">${x.kind}</span></td><td class="wide">${esc(x.desc||x.category||'—')}</td><td class="bold">${x.kind==='entrada'?'+':'−'} ${M(x.amount)}</td><td>${!x.jobId?`<button class="btn sm out" data-edit="${x.kind==='entrada'?'income':'expense'}:${x.id}">Editar</button>`:'<span class="muted">Serviço</span>'}</td></tr>`).join('')}</tbody></table>`:empty('Nenhuma movimentação registrada.')}</div>`}
function expenses(){let arr=[...db.expenses].reverse();let categories={};arr.forEach(x=>categories[x.category]=(categories[x.category]||0)+n(x.amount));return `<div class="toolbar"><h2>Controle de gastos</h2><button class="btn" data-new="expense">+ Novo gasto</button></div><div class="grid4 sectionTitle"><div class="card metric red"><div class="mini">⛽</div><div class="caption">Combustível</div><strong>${M(categories['Combustível'])}</strong></div><div class="card metric"><div class="mini">♢</div><div class="caption">Material</div><strong>${M(categories['Material'])}</strong></div><div class="card metric"><div class="mini">▣</div><div class="caption">Outros</div><strong>${M(Object.entries(categories).filter(([k])=>!['Combustível','Material'].includes(k)).reduce((a,[,v])=>a+v,0))}</strong></div><div class="card metric"><div class="mini">↘</div><div class="caption">Total de gastos</div><strong>${M(arr.reduce((a,x)=>a+n(x.amount),0))}</strong></div></div><div class="card tableWrap sectionTitle">${arr.length?`<table class="table"><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Ações</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${dateFmt(x.date)}</td><td>${esc(x.category)}</td><td class="wide">${esc(x.desc)}</td><td>${M(x.amount)}</td><td><button class="btn sm out" data-edit="expense:${x.id}">Editar</button></td></tr>`).join('')}</tbody></table>`:empty('Você ainda não registrou gastos.')}</div>`}
function settings(){return `<div class="two"><div class="card"><h3>Dados da empresa</h3><form id="settingsForm" class="fieldGrid" style="margin-top:15px"><label class="full">Nome<input name="company" value="${esc(db.settings.company)}" required></label><label>Telefone<input name="phone" value="${esc(db.settings.phone)}"></label><label>Cidade / região<input name="city" value="${esc(db.settings.city)}"></label><label>Comissão padrão sobre a mão de obra (%)<input name="commission" type="number" min="0" max="100" step="0.1" value="${esc(db.settings.commission)}"></label><div class="full"><button class="btn">Salvar dados</button></div></form></div><div class="card"><h3>Acessos locais</h3><p class="muted" style="font-size:12px;line-height:1.6;margin:12px 0">Funcionário vê clientes, agenda e serviços. Só o proprietário vê orçamentos, financeiro, gastos e configurações. As senhas são locais e não oferecem segurança de contas online.</p><form id="passwordForm" class="fieldGrid"><label class="full">Nova senha do proprietário<input name="ownerPin" type="password" inputmode="numeric" minlength="6" placeholder="Deixe vazio para manter"></label><label class="full">Nova senha do funcionário<input name="employeePin" type="password" inputmode="numeric" minlength="6" placeholder="Deixe vazio para manter"></label><div class="full"><button class="btn">Atualizar senhas</button></div></form></div><div class="card"><h3>Backup e restauração</h3><p class="muted" style="font-size:12px;line-height:1.6;margin:12px 0">Exporte seus dados em arquivo JSON. A restauração substitui todos os registros deste navegador.</p><button class="btn" id="export">⬇ Fazer backup</button><label style="margin-top:15px">Restaurar backup<input type="file" accept="application/json,.json" id="restore"></label></div><div class="card"><h3>Sobre o aplicativo</h3><div class="ident" style="margin:13px 0">Versão local: sem conexão bancária. Dados guardados neste aparelho. Para uso simultâneo, com sincronização e senhas seguras, será necessário um serviço online.</div><p class="muted" style="font-size:12px;line-height:1.6">Instalar na tela inicial do iPhone: abra uma versão publicada em HTTPS no Safari e toque em Compartilhar → Adicionar à Tela de Início. A instalação não funciona ao abrir o arquivo local diretamente.</p></div></div>`}
function openModal(kind,id){if(kind==='quote'&&!isOwner()||['income','expense'].includes(kind)&&!isOwner())return;editing=id?db[{client:'clients',quote:'quotes',job:'jobs',expense:'expenses',income:'incomes'}[kind]].find(x=>x.id===id):null;modal=kind;if(kind==='quote')quoteRows=editing?JSON.parse(JSON.stringify(editing.items)):[{desc:'Mão de obra',qty:1,price:0}];const data=editing||{},header={client:'Cliente',quote:'Orçamento',job:'Serviço',expense:'Gasto',income:'Entrada'}[kind];let html='';let options=db.clients.map(c=>`<option value="${esc(c.id)}" ${c.id===data.clientId?'selected':''}>${esc(c.name)}</option>`).join('');
if(kind==='client')html=`<label class="full">Nome do cliente<input name="name" required value="${esc(data.name||'')}"></label><label>Telefone / WhatsApp<input name="phone" inputmode="tel" value="${esc(data.phone||'')}"></label><label>E-mail<input name="email" type="email" value="${esc(data.email||'')}"></label><label class="full">Endereço / cidade<input name="address" value="${esc(data.address||'')}"></label><label class="full">Observações<textarea name="notes">${esc(data.notes||'')}</textarea></label>`;
if(kind==='quote')html=`<label>Cliente<select name="clientId" required><option value="">Selecione</option>${options}</select></label><label>Data<input name="date" type="date" value="${esc(data.date||today())}" required></label><label class="full">Descrição do orçamento<input name="title" required value="${esc(data.title||'')}"></label><label>Situação<select name="status">${['pendente','aprovado','recusado'].map(x=>`<option value="${x}" ${data.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Desconto (R$)<input name="discount" type="number" step="0.01" min="0" value="${n(data.discount)}"></label><div class="full"><h3 style="margin-bottom:9px">Itens do orçamento</h3><div class="editorItems" id="itemsEditor"></div><button class="btn soft sm" type="button" id="addItem" style="margin-top:9px">+ Adicionar item</button><div class="row" style="margin-top:11px"><span class="muted">Total</span><b id="quoteTotal">—</b></div></div><label class="full">Condições / observações<textarea name="notes">${esc(data.notes||'')}</textarea></label>`;
if(kind==='job')html=`<label>Cliente<select name="clientId" required><option value="">Selecione</option>${options}</select></label><label>Data<input name="date" type="date" value="${esc(data.date||today())}" required></label><label class="full">Descrição do serviço<input name="desc" required value="${esc(data.desc||'')}"></label><label>Status<select name="status">${['agendado','em andamento','concluido','cancelado'].map(x=>`<option value="${x}" ${data.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Pagamento<select name="payStatus" ${!isOwner()?'disabled':''}><option value="pendente" ${data.payStatus!=='pago'?'selected':''}>Pendente</option><option value="pago" ${data.payStatus==='pago'?'selected':''}>Recebido</option></select></label>${isOwner()?`<label>Valor total do serviço (R$)<input name="price" type="number" min="0" step="0.01" value="${n(data.price)}" required></label><label>Mão de obra (R$)<input name="labor" type="number" min="0" step="0.01" value="${n(data.labor)}"></label><label>% para ajudante<input name="rate" type="number" min="0" max="100" step="0.1" value="${data.rate??db.settings.commission}"></label>`:''}<label class="full">Detalhes / material usado<textarea name="notes">${esc(data.notes||'')}</textarea></label>`;
if(kind==='expense')html=`<label>Data<input type="date" name="date" value="${esc(data.date||today())}" required></label><label>Categoria<select name="category">${['Combustível','Material','Ferramentas','Pedágio','Alimentação','Manutenção','Transporte','Outros'].map(x=>`<option ${data.category===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="full">Descrição<input name="desc" value="${esc(data.desc||'')}" required placeholder="Ex.: gasolina para atendimento"></label><label>Valor (R$)<input name="amount" type="number" min="0.01" step="0.01" value="${data.amount??''}" required></label><label>Forma de pagamento<select name="method">${['Pix','Dinheiro','Cartão','Outro'].map(x=>`<option ${data.method===x?'selected':''}>${x}</option>`).join('')}</select></label>`;
if(kind==='income')html=`<label>Data<input type="date" name="date" value="${esc(data.date||today())}" required></label><label>Valor (R$)<input name="amount" type="number" min="0.01" step="0.01" value="${data.amount??''}" required></label><label class="full">Descrição<input name="desc" value="${esc(data.desc||'')}" required></label>`;
let existing=kind==='client'&&db.jobs.some(j=>j.clientId===id)||kind==='quote'&&db.jobs.some(j=>j.quoteId===id)||kind==='job'&&db.incomes.some(i=>i.jobId===id);
document.body.insertAdjacentHTML('beforeend',`<div class="modalShade" id="shade"><div class="modal" role="dialog" aria-modal="true" aria-label="${header}"><div class="modalHead"><h2>${editing?'Editar':'Novo'} ${header.toLowerCase()}</h2><button class="x" id="closeModal" aria-label="Fechar">×</button></div><form id="entryForm" class="fieldGrid">${html}<div class="full actions">${editing&&!existing?`<button class="btn danger" type="button" id="deleteRecord">Excluir</button>`:''}<button class="btn out" type="button" id="cancel">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form></div></div>`);
const shade=document.getElementById('shade');shade.addEventListener('click',e=>{if(e.target===shade)closeModal()});document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancel').onclick=closeModal;document.getElementById('entryForm').addEventListener('submit',saveForm);if(kind==='quote'){renderItems();document.getElementById('addItem').onclick=()=>{quoteRows.push({desc:'',qty:1,price:0});renderItems()}}if(editing&&document.getElementById('deleteRecord'))document.getElementById('deleteRecord').onclick=()=>{if(!confirm('Excluir este registro?'))return;db[{client:'clients',quote:'quotes',job:'jobs',expense:'expenses',income:'incomes'}[kind]]=db[{client:'clients',quote:'quotes',job:'jobs',expense:'expenses',income:'incomes'}[kind]].filter(x=>x.id!==id);save();closeModal();draw();notify('Registro excluído.')};}
function closeModal(){document.getElementById('shade')?.remove();modal=null;editing=null;quoteRows=[]}
function renderItems(){const el=document.getElementById('itemsEditor');el.innerHTML=quoteRows.map((r,i)=>`<div class="editorRow"><input aria-label="Descrição item ${i+1}" data-i="${i}" data-field="desc" placeholder="Descrição" value="${esc(r.desc)}"><input aria-label="Quantidade item ${i+1}" data-i="${i}" data-field="qty" type="number" min="0.01" step="0.01" value="${n(r.qty)}"><input aria-label="Preço item ${i+1}" data-i="${i}" data-field="price" type="number" min="0" step="0.01" value="${n(r.price)}"><button class="btn danger sm" data-remove="${i}" type="button" aria-label="Remover item">×</button></div>`).join('');el.querySelectorAll('input').forEach(x=>x.addEventListener('input',()=>{quoteRows[Number(x.dataset.i)][x.dataset.field]=x.dataset.field==='desc'?x.value:n(x.value);updateTotal()}));el.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{if(quoteRows.length===1)return notify('Inclua pelo menos um item.');quoteRows.splice(Number(x.dataset.remove),1);renderItems()});document.querySelector('[name=discount]')?.addEventListener('input',updateTotal);updateTotal()}
function updateTotal(){document.getElementById('quoteTotal').textContent=M(totalQuote({items:quoteRows,discount:document.querySelector('[name=discount]')?.value}))}
function saveForm(e){e.preventDefault();let kind=modal,f=e.target,raw=Object.fromEntries(new FormData(f)),data={...(editing||{}),...raw},target={client:'clients',quote:'quotes',job:'jobs',expense:'expenses',income:'incomes'}[kind];if(kind==='client'&&!raw.name.trim())return notify('Informe o nome.');if(kind==='quote'){if(!raw.clientId||!raw.title.trim()||!quoteRows.length||quoteRows.some(x=>!x.desc.trim()||n(x.qty)<=0))return notify('Preencha cliente, descrição e itens.');data.items=quoteRows.map(x=>({...x,qty:n(x.qty),price:n(x.price)}));data.discount=n(data.discount);if(totalQuote(data)<0)return notify('Desconto não pode passar do total.');if(!editing)data.number=String(db.quotes.reduce((a,q)=>Math.max(a,Number(q.number)||0),0)+1).padStart(4,'0')}
if(kind==='job'){if(!raw.clientId||!raw.desc.trim())return notify('Informe cliente e descrição.');if(!isOwner()){data.price=editing?.price||0;data.labor=editing?.labor||0;data.rate=editing?.rate??db.settings.commission;data.payStatus=editing?.payStatus||'pendente'}else{data.price=n(raw.price);data.labor=n(raw.labor);data.rate=n(raw.rate);if(data.labor>data.price)return notify('Mão de obra não pode passar do valor total.')}}
if(['expense','income'].includes(kind)){data.amount=n(raw.amount);if(!data.amount)return notify('Informe um valor maior que zero.')}
if(!editing)data.id=uid();if(!editing)db[target].push(data);else db[target]=db[target].map(x=>x.id===editing.id?data:x);if(kind==='job'&&isOwner())syncJobIncome(data);save();closeModal();draw();notify('Salvo com sucesso!')}
function syncJobIncome(job){let index=db.incomes.findIndex(i=>i.jobId===job.id);if(job.payStatus==='pago'){const inc={id:index>=0?db.incomes[index].id:uid(),date:job.date||today(),amount:n(job.price),desc:'Recebimento: '+job.desc+' — '+clientName(job.clientId),jobId:job.id};if(index>=0)db.incomes[index]=inc;else db.incomes.push(inc)}else if(index>=0)db.incomes.splice(index,1)}
function printQuote(id){const q=db.quotes.find(x=>x.id===id);if(!q)return;const cl=C(q.clientId)||{};document.getElementById('printArea').innerHTML=`<div class="printTop"><div><h1>${esc(db.settings.company)}</h1><small>Elétrica predial • Instalação de câmeras</small><p>${esc(db.settings.city)} • ${esc(db.settings.phone)}</p></div><div style="text-align:right"><h2>ORÇAMENTO</h2><b>Nº ${esc(q.number)}</b><p>${dateFmt(q.date)}</p></div></div><p><b>Cliente:</b> ${esc(cl.name||'—')}</p><p><b>Telefone:</b> ${esc(cl.phone||'—')}</p><p><b>Endereço:</b> ${esc(cl.address||'—')}</p><h3 style="margin-top:25px">${esc(q.title)}</h3><table><thead><tr><th>Descrição</th><th>Qtd.</th><th>Unitário</th><th>Total</th></tr></thead><tbody>${q.items.map(x=>`<tr><td>${esc(x.desc)}</td><td>${n(x.qty)}</td><td>${M(x.price)}</td><td>${M(n(x.qty)*n(x.price))}</td></tr>`).join('')}</tbody></table><p style="text-align:right">Desconto: ${M(q.discount)}</p><div class="total">TOTAL ${M(totalQuote(q))}</div><p style="margin-top:24px"><b>Observações:</b> ${esc(q.notes||'—')}</p><p style="margin-top:50px;border-top:1px solid #aaa;padding-top:8px">Thiago Reis — serviços de elétrica e câmeras</p>`;window.print()}
function quickPaid(id){let j=db.jobs.find(x=>x.id===id);if(!j||!isOwner())return;if(!confirm('Confirmar recebimento deste serviço?'))return;j.payStatus='pago';syncJobIncome(j);save();draw();notify('Pagamento registrado.')}
function bindMain(){document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{page=x.dataset.page;filter='';draw();window.scrollTo(0,0)});document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{page=x.dataset.go;filter='';draw()});document.querySelectorAll('[data-new]').forEach(x=>x.onclick=()=>{if(['quote','job'].includes(x.dataset.new)&&!db.clients.length){notify('Cadastre um cliente primeiro.');return openModal('client')}openModal(x.dataset.new)});document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{let [kind,id]=x.dataset.edit.split(':');openModal(kind,id)});document.querySelectorAll('[data-print]').forEach(x=>x.onclick=()=>printQuote(x.dataset.print));document.querySelectorAll('[data-paid]').forEach(x=>x.onclick=()=>quickPaid(x.dataset.paid));document.getElementById('logout').onclick=()=>{current=null;try{sessionStorage.removeItem(SESSION)}catch(e){}draw()};document.getElementById('search')?.addEventListener('input',e=>{let pos=e.target.selectionStart;filter=e.target.value;let elem=document.activeElement;const holder=elem.parentElement.parentElement;const wrap=holder.parentElement; // avoid re-render while typing; filter table rows locally
wrap.querySelectorAll('tbody tr').forEach(tr=>{tr.hidden=!tr.textContent.toLowerCase().includes(filter.toLowerCase())});});if(page==='ajustes')bindSettings()}
function bindSettings(){document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault();let r=Object.fromEntries(new FormData(e.target));db.settings.company=r.company;db.settings.phone=r.phone;db.settings.city=r.city;db.settings.commission=Math.min(100,n(r.commission));save();draw();notify('Dados atualizados.')};document.getElementById('passwordForm').onsubmit=e=>{e.preventDefault();let r=Object.fromEntries(new FormData(e.target));if([r.ownerPin,r.employeePin].some(x=>x&&!/^\d{6,}$/.test(x)))return notify('Senha precisa ter 6 números ou mais.');if(r.ownerPin)db.settings.ownerPin=r.ownerPin;if(r.employeePin)db.settings.employeePin=r.employeePin;if(db.settings.ownerPin===db.settings.employeePin)return notify('Senhas precisam ser diferentes.');save();e.target.reset();notify('Senhas alteradas.')};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='thiago-reis-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};document.getElementById('restore').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.settings||!['clients','quotes','jobs','expenses','incomes'].every(x=>Array.isArray(data[x])))throw Error();if(!confirm('Substituir TODOS os dados atuais pelo backup?'))return;db=data;save();current=null;try{sessionStorage.removeItem(SESSION)}catch(e){}draw();notify('Backup restaurado. Entre novamente.')}catch(err){notify('Arquivo de backup inválido.')}}}
window.addEventListener('error',e=>{console.error(e.error)});draw();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
