</style></head><body><div id="app"></div><div id="printArea" class="printArea"></div><script>
(()=>{'use strict';
const API='/api';
const CLOUD_MODE=!!document.querySelector('meta[name="tr-cloud"]');
const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>String(Date.now())+'-'+Math.random().toString(36).slice(2,8);
const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const dateFmt=s=>s?String(s).split('-').reverse().join('/'): '—';
const n=s=>Math.max(0,Number(String(s||0).replace(',','.'))||0);
function blank(){return{version:4,clients:[],quotes:[],jobs:[],expenses:[],incomes:[],catalog:[{"id":"s1","name":"Instalação de tomada","category":"Elétrica predial","price":null,"unit":"un"},{"id":"s2","name":"Troca de tomada ou interruptor","category":"Elétrica predial","price":null,"unit":"un"},{"id":"s3","name":"Instalação de disjuntor","category":"Elétrica predial","price":null,"unit":"un"},{"id":"s4","name":"Troca de chuveiro","category":"Elétrica predial","price":null,"unit":"un"},{"id":"s5","name":"Instalação de luminária","category":"Iluminação","price":null,"unit":"un"},{"id":"s6","name":"Instalação de ventilador","category":"Iluminação","price":null,"unit":"un"},{"id":"s7","name":"Passagem de fiação","category":"Elétrica predial","price":null,"unit":"un"},{"id":"s8","name":"Montagem de quadro elétrico","category":"Elétrica predial","price":null,"unit":"un"},{"id":"s9","name":"Identificação de curto-circuito","category":"Manutenção","price":null,"unit":"un"},{"id":"s10","name":"Visita técnica","category":"Manutenção","price":null,"unit":"un"},{"id":"s11","name":"Instalação de câmera de segurança","category":"CFTV e câmeras","price":null,"unit":"un"},{"id":"s12","name":"Configuração de DVR / NVR","category":"CFTV e câmeras","price":null,"unit":"un"},{"id":"s13","name":"Configuração de câmera Wi-Fi","category":"CFTV e câmeras","price":null,"unit":"un"},{"id":"s14","name":"Troca de fonte de DVR","category":"CFTV e câmeras","price":null,"unit":"un"},{"id":"s15","name":"Instalação de cabo de rede","category":"Redes","price":null,"unit":"un"},{"id":"s16","name":"Manutenção de câmeras","category":"CFTV e câmeras","price":null,"unit":"un"}],settings:{company:'Thiago Reis',phone:'14996600996',city:'Iacanga - SP e região',commission:40,cnpj:'69.565.582/0001-50',legalName:'',address:'',email:'',quoteValidity:15,documentNotes:'',ownerPin:'',employeePin:''}}}
let db=blank(),revision=0,ready=false,configured=false;
for(const k of ['clients','quotes','jobs','expenses','incomes','catalog'])if(!Array.isArray(db[k]))db[k]=[];
db.settings={...blank().settings,...(db.settings||{})}; if(!db.settings.cnpj) db.settings.cnpj='69.565.582/0001-50';
let current=null;
let page='inicio',filter='',modal=null,editing=null,quoteRows=[],toastTimer=null,financeMonth=today().slice(0,7);
const app=document.getElementById('app');
let syncQueue=Promise.resolve(),saving=false;
const LOCAL_KEY='thiago-reis-pro-v4-local';
const ROLE_KEY='thiago-reis-pro-v4-role';
const readLocal=()=>{try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'null')}catch(e){return null}};
const writeLocal=x=>{try{localStorage.setItem(LOCAL_KEY,JSON.stringify(x));return true}catch(e){throw new Error('Armazenamento indisponível neste navegador.')}};
async function pinHash(salt,pin){const data=new TextEncoder().encode(salt+String(pin));const digest=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function requestJSON(path,method='GET',data=null){
 if(CLOUD_MODE){
   let response;
   try {
     response=await fetch(API+path,{method,headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:method==='GET'?undefined:JSON.stringify(data||{})});
   } catch(e){throw new Error('Sem conexão com o servidor. Nenhum dado foi salvo.')}
   const payload=await response.json().catch(()=>({}));
   if(!response.ok)throw Object.assign(new Error(payload.error||'Não foi possível concluir a operação.'),{status:response.status});
   return payload;
 }
 const stored=readLocal();let role=sessionStorage.getItem(ROLE_KEY)||null;
 if(path==='/status')return {configured:!!stored,role:stored?role:null};
 if(path==='/setup'&&method==='POST'){
   if(stored)throw new Error('Sistema já configurado.');
   if(!data?.ownerPin||!data?.employeePin||data.ownerPin===data.employeePin||data.ownerPin.length<6||data.employeePin.length<6)throw new Error('Informe duas senhas distintas com pelo menos 6 caracteres.');
   const salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
   const o=await pinHash(salt,data.ownerPin),e=await pinHash(salt,data.employeePin);
   writeLocal({revision:1,data:blank(),salt,ownerHash:o,employeeHash:e});sessionStorage.setItem(ROLE_KEY,'dono');return {ok:true};
 }
 if(path==='/login'&&method==='POST'){
   if(!stored)throw new Error('Configure o acesso primeiro.');
   const hash=await pinHash(stored.salt,data?.password||'');
   if(!['dono','funcionario'].includes(data?.role)||hash!==(data.role==='dono'?stored.ownerHash:stored.employeeHash))throw new Error('Senha incorreta.');
   sessionStorage.setItem(ROLE_KEY,data.role);return {ok:true,role:data.role};
 }
 if(path==='/logout'){sessionStorage.removeItem(ROLE_KEY);return {ok:true}}
 if(!stored||!role)throw Object.assign(new Error('Entre novamente.'),{status:401});
 if(path==='/data'&&method==='GET')return {data:stored.data,revision:stored.revision,role};
 if(path==='/data'&&method==='PUT'){
    if(data?.revision!==stored.revision)throw Object.assign(new Error('Os dados foram alterados, recarregue a página.'),{status:409});
    if(role!=='dono'){
      // Bloqueia alteração do financeiro e da tabela de preços pelo fluxo do funcionário.
      const incoming=data.data||{};
      for(const key of ['expenses','incomes','quotes','catalog','settings'])if(JSON.stringify(incoming[key])!==JSON.stringify(stored.data[key]))throw Object.assign(new Error('Sem permissão para alterar '+key),{status:403});
    }
    stored.data=data.data;stored.revision+=1;writeLocal(stored);
    return {revision:stored.revision};
 }
 throw new Error('Operação indisponível nesta versão local: '+path);
}
async function save(){const copy=JSON.parse(JSON.stringify(db));const attempt=syncQueue.then(async()=>{const resp=await requestJSON('/data','PUT',{revision,data:copy});revision=resp.revision;return true});syncQueue=attempt.catch(()=>{});try{return await attempt}catch(e){notify('Não foi salvo: '+(e.message||'erro de conexão'));if(e.status===409){try{await loadDB();draw()}catch(_){}notify('Outro aparelho alterou os dados. Reabra o cadastro e confira.')}return false}}
async function loadDB(){const r=await requestJSON('/data');db={...blank(),...r.data};db.catalog=Array.isArray(r.data.catalog)?r.data.catalog:[];db.settings={...blank().settings,...r.data.settings}; if(!db.settings.cnpj) db.settings.cnpj='69.565.582/0001-50';revision=r.revision;current=r.role;configured=true;}
async function bootstrap(){app.innerHTML='<div class="login card"><h1>THIAGO REIS</h1><p>Carregando dados…</p></div>';try{let st=await requestJSON('/status');configured=st.configured;current=st.role;if(current)await loadDB();db.settings.ownerPin=configured?'*online*':'';ready=true;draw()}catch(err){app.innerHTML='<div class="login card"><h1>Sem conexão</h1><p>Não foi possível acessar o servidor. Confira a internet e atualize a página.</p><button class="btn" id="retry">Tentar novamente</button></div>';document.getElementById('retry').onclick=bootstrap;}}

function notify(t){let old=document.querySelector('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),3300)}
function logo(){return `<svg viewBox="0 0 76 76" width="56" height="56" aria-label="Thiago Reis - Logo" role="img"><defs><linearGradient id="logoG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66D7FF"/><stop offset="1" stop-color="#0873F5"/></linearGradient></defs><rect x="1" y="1" width="74" height="74" rx="20" fill="#04162B" stroke="#2879C4" stroke-width="1.5"/><path d="M12 23H42L35 33H27L20 55H9L16 33H9Z" fill="#F0F8FF"/><path d="M41 23h16c18 0 18 22 4 25l8 11H56L45 43h8c8 0 9-10 2-10H40Z" fill="url(#logoG)"/><path d="m42 5-9 17h9L35 36l20-21H43l7-10Z" fill="#69DDFE"/></svg>`}
const menu=[['inicio','⌂','Visão geral'],['clientes','♙','Clientes'],['orcamentos','▤','Orçamentos'],['catalogo','◈','Tabela de preços'],['servicos','⚡','Serviços'],['agenda','▦','Agenda'],['financeiro','▥','Financeiro'],['gastos','▣','Gastos'],['ferramentas','⌘','Ferramentas'],['ajustes','⚙','Configurações']];

function setupHTML(){return `<div class="login card"><div class="auth-star"></div><div class="loginlogo">${logo()}</div><div class="login-eyebrow">ELETRICIDADE · TECNOLOGIA · GESTÃO</div><h1>THIAGO <span class="brand-blue">REIS</span></h1><p>Plataforma profissional de elétrica e segurança eletrônica</p><h3>Primeiro acesso</h3><p style="text-align:left">Crie as senhas para você e seu funcionário. ${CLOUD_MODE?'Acesso corporativo: seus dados serão compartilhados pelo servidor e banco PostgreSQL.':'Os dados ficam salvos somente neste aparelho. A versão compartilhada exige uma hospedagem com banco de dados.'}</p><form id="setup">${CLOUD_MODE?'<label class="full">Código de ativação da empresa<input id="setupCode" type="password" autocomplete="off" required placeholder="Código privado da hospedagem"></label>':'<input id="setupCode" type="hidden" value="local">'} <label>Senha do proprietário (mínimo 6 caracteres)<input id="ownerPin" type="password" autocomplete="new-password" minlength="6" required></label><label>Senha do funcionário (mínimo 6 caracteres)<input id="employeePin" type="password" autocomplete="new-password" minlength="6" required></label><button class="btn">Começar</button></form><footer>${CLOUD_MODE?'Proteja suas senhas e o código de ativação. Não compartilhe a senha do proprietário.':'Salve suas senhas. Os dados desta versão ficam somente neste aparelho. Faça backup regularmente.'}</footer></div>`}
function loginHTML(){return `<div class="login card"><div class="auth-star"></div><div class="loginlogo">${logo()}</div><div class="login-eyebrow">CENTRAL DE GESTÃO PROFISSIONAL</div><h1>THIAGO <span class="brand-blue">REIS</span></h1><p>Elétrica predial • CFTV • Orçamentos • Financeiro</p><div class="auth-chips"><span>⚡ ELÉTRICA</span><span>◉ CFTV</span><span>▤ GESTÃO</span></div><form id="login"><label>Acesso<select id="role"><option value="dono">Proprietário</option><option value="funcionario">Funcionário</option></select></label><label>Senha<input id="pin" type="password" autocomplete="current-password" required></label><button class="btn">Entrar no sistema</button></form><footer>${CLOUD_MODE?'Acesso seguro com registros sincronizados no banco da empresa.':'Seus registros ficam somente neste aparelho. Para acesso compartilhado, é necessário conectar um servidor.'}</footer></div>`}
function bindSetup(){document.getElementById('setup').addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('ownerPin').value,b=document.getElementById('employeePin').value,setupCode=document.getElementById('setupCode').value;if(a.length<(CLOUD_MODE?8:6)||b.length<(CLOUD_MODE?8:6)||a===b)return notify('Use senhas diferentes, com pelo menos '+(CLOUD_MODE?8:6)+' caracteres.');try{await requestJSON('/setup','POST',{setupCode,ownerPin:a,employeePin:b,initialData:blank()});await loadDB();draw();notify('Contas criadas com sucesso!')}catch(err){notify(err.message)}})}

const C=id=>db.clients.find(x=>x.id===id);

function finance(){let s=stats();let period=db.incomes.filter(x=>String(x.date||'').startsWith(financeMonth)),costs=db.expenses.filter(x=>String(x.date||'').startsWith(financeMonth)),earned=period.reduce((a,x)=>a+n(x.amount),0),spent=costs.reduce((a,x)=>a+n(x.amount),0);let entries=[...db.incomes.map(x=>({...x,kind:'entrada'})),...db.expenses.map(x=>({...x,kind:'saída'}))].filter(x=>String(x.date||'').startsWith(financeMonth)).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,250);return `<div class="grid4"><div class="card metric green"><div class="mini">↗</div><div class="caption">Entradas</div><strong>${M(s.paid)}</strong></div><div class="card metric red"><div class="mini">↘</div><div class="caption">Gastos</div><strong>${M(s.exp)}</strong></div><div class="card metric"><div class="mini">♙</div><div class="caption">40% / ajudante*</div><strong>${M(s.com)}</strong></div><div class="card metric"><div class="mini">▣</div><div class="caption">Saldo estimado</div><strong>${M(s.balance)}</strong></div></div><div class="notice">* Comissão calculada sobre a mão de obra dos serviços marcados como recebidos. Saldo = entradas - despesas - comissão. Os lançamentos são manuais, sem ligação com banco. Não representa contabilidade fiscal.</div><div class="toolbar sectionTitle"><h2>Movimentações do mês</h2><div class="row"><label style="max-width:155px">Mês<input id="financeMonth" type="month" value="${esc(financeMonth)}"></label><button class="btn out" id="exportCSV">Baixar CSV</button><button class="btn soft" data-new="income">+ Entrada avulsa</button><button class="btn" data-new="expense">+ Despesa</button></div></div><div class="notice">No mês selecionado: <b>${M(earned)}</b> em entradas e <b>${M(spent)}</b> em despesas. Diferença antes da comissão: <b>${M(earned-spent)}</b>.</div><div class="card tableWrap">${entries.length?`<table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Ações</th></tr></thead><tbody>${entries. function openModal(kind,id){if(kind==='quote'&&!isOwner()||['income','expense','catalog'].includes(kind)&&!isOwner())return;editing=id?db[{client:'clients',quote:'quotes',job:'jobs',expense:'expenses',income:'incomes',catalog:'catalog'}[kind]].find(x=>x.id===id):null;modal=kind;if(kind==='quote')quoteRows=editing?JSON.parse(JSON.stringify(editing.items)):[];const data=editing||{},header={client:'Cliente',quote:'Orçamento',job:'Serviço',expense:'Gasto',income:'Entrada',catalog:'Item da tabela'}[kind];let html='';let options=db.clients.map(c=>`<option value="${esc(c.id)}" ${c.id===data.clientId?'selected':''}>${esc(c.name)}</option>`).join('');
if(kind==='client')html=`<label class="full">Nome do cliente<input name="name" required value="${esc(data.name||'')}"></label><label>Telefone / WhatsApp<input name="phone" inputmode="tel" value="${esc(data.phone||'')}"></label><label>E-mail<input name="email" type="email" value="${esc(data.email||'')}"></label><label class="full">CPF/CNPJ do cliente (opcional)<input name="document" value="${esc(data.document||'')}"></label><label class="full">Endereço / cidade<input name="address" value="${esc(data.address||'')}"></label><label class="full">Observações<textarea name="notes">${esc(data.notes||'')}</textarea></label>`;

if(kind==='job')html=`<label>Cliente<select name="clientId" required><option value="">Selecione</option>${options}</select></label><label>Data<input name="date" type="date" value="${esc(data.date||today())}" required></label><label class="full">Descrição do serviço<input name="desc" required value="${esc(data.desc||'')}"></label><label>Status<select name="status">${['agendado','em andamento','concluido','cancelado'].map(x=>`<option value="${x}" ${data.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Pagamento<select name="payStatus" ${!isOwner()?'disabled':''}><option value="pendente" ${data.payStatus!=='pago'?'selected':''}>Pendente</option><option value="pago" ${data.payStatus==='pago'?'selected':''}>Recebido</option></select></label>${isOwner()?`<label>Valor total do serviço (R$)<input name="price" type="number" min="0" step="0.01" value="${n(data.price)}" required></label><label>Mão de obra (R$)<input name="labor" type="number" min="0" step="0.01" value="${n(data.labor)}"></label><label>% para ajudante<input name="rate" type="number" min="0" max="100" step="0.1" value="${data.rate??db.settings.commission}"></label>`:''}<label class="full">Detalhes / material usado<textarea name="notes">${esc(data.notes||'')}</textarea></label>`;
if(kind==='expense')html=`<label>Data<input type="date" name="date" value="${esc(data.date||today())}" required></label><label>Categoria<select name="category">${['Combustível','Material','Ferramentas','Pedágio','Alimentação','Manutenção','Transporte','Outros'].map(x=>`<option ${data.category===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="full">Descrição<input name="desc" value="${esc(data.desc||'')}" required placeholder="Ex.: gasolina para atendimento"></label><label>Valor (R$)<input name="amount" type="number" min="0.01" step="0.01" value="${data.amount??''}" required></label><label>Forma de pagamento<select name="method">${['Pix','Dinheiro','Cartão','Outro'].map(x=>`<option ${data.method===x?'selected':''}>${x}</option>`).join('')}</select></label>`;
if(kind==='catalog')html=`<label class="full">Nome do serviço<input name="name" required value="${esc(data.name||'')}" placeholder="Ex.: Instalação de câmera"></label><label>Categoria<select name="category">${['Elétrica predial','CFTV e câmeras','Manutenção','Iluminação','Redes','Materiais','Outros'].map(x=>`<option ${data.category===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Unidade<select name="unit">${['un','metro','hora','diária','serviço'].map(x=>`<option ${data.unit===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="full">Preço de venda (R$)<input name="price" type="number" min="0" step="0.01" value="${data.price??''}" required placeholder="Defina o preço"></label>`;
if(kind==='income')html=`<label>Data<input type="date" name="date" value="${esc(data.date||today())}" required></label><label>Valor (R$)<input name="amount" type="number" min="0.01" step="0.01" value="${data.amount??''}" required></label><label class="full">Descrição<input name="desc" value="${esc(data.desc||'')}" required></label><label>Recebimento<select name="method">${['Pix','Dinheiro','Cartão','Transferência','Outro'].map(x=>`<option ${data.method===x?'selected':''}>${x}</option>`).join('')}</select></label>`;
let existing=!isOwner()||kind==='client'&&db.jobs.some(j=>j.clientId===id)||kind==='quote'&&db.jobs.some(j=>j.quoteId===id)||kind==='job'&&db.incomes.some(i=>i.jobId===id);
document.body.insertAdjacentHTML('beforeend',`<div class="modalShade" id="shade"><div class="modal" role="dialog" aria-modal="true" aria-label="${header}"><div class="modalHead"><h2>${editing?'Editar':'Novo'} ${header.toLowerCase()}</h2><button class="x" id="closeModal" aria-label="Fechar">×</button></div><form id="entryForm" class="fieldGrid">${html}<div class="full actions">${editing&&!existing?`<button class="btn danger" type="button" id="deleteRecord">Excluir</button>`:''}<button class="btn out" type="button" id="cancel">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form></div></div>`);
const shade=document.getElementById('shade');shade.addEventListener('click',e=>{if(e.target===shade)closeModal()});document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancel').onclick=closeModal;document.getElementById('entryForm').addEventListener('submit',saveForm);if(kind==='quote'){
renderItems();
const add=(desc,price=0)=>{quoteRows.push({desc,qty:1,price});renderItems()};

function closeModal(){document.getElementById('shade')?.remove();modal=null;editing=null;quoteRows=[]}

function makeQuotePDF(q) {
  const cl=C(q.clientId)||{}, st=db.settings||{};
  const W=595.28,H=841.89;
  const ink=[.07,.15,.24],navy=[.025,.09,.17],blue=[.03,.47,.89],
    pale=[.93,.965,1],gold=[.89,.69,.31],white=[1,1,1],muted=[.32,.40,.48],line=[.84,.89,.93];
  const pages=[];let cmds=[];
  const rgb=c=>c.map(n=>Number(n).toFixed(3)).join(' ');
  function add(s){cmds.push(s)}
  function fill(c){add(`${rgb(c)} rg`)}
  function stroke(c){add(`${rgb(c)} RG`)}
  function rect(x,y,w,h,col,edge=null){
    if(col)fill(col);if(edge)stroke(edge);
    add(`${x.toFixed(2)} ${(H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${col&&edge?'B':col?'f':'S'}`);
  }
  function ln(x,y,x2,y2,c=line,lw=.7){
    stroke(c);add(`${lw} w ${x} ${(H-y).toFixed(2)} m ${x2} ${(H-y2).toFixed(2)} l S`);
  }
  function poly(coords,color){
    if(!coords.length)return;
    fill(color);
    add(`${coords.map((v,i)=>`${i?'':' '}${v[0].toFixed(2)} ${(H-v[1]).toFixed(2)} ${i?'l':'m'}`).join(' ')} h f`);
  }
  function pdfString(txt){
    const aliases={8211:150,8212:151,8216:145,8217:146,8220:147,8221:148,8230:133,8364:128,8226:149,8482:153};
    return Array.from(String(txt??'')).map(ch=>{
      const u=ch.codePointAt(0),b=u<=255?u:(aliases[u]||63);
      if(b===40||b===41||b===92)return '\\'+String.fromCharCode(b);
      if(b<32||b>=127)return '\\'+b.toString(8).padStart(3,'0');
      return String.fromCharCode(b);
    }).join('');
  }
  function tx(v,x,y,size=10,bold=false,color=ink){
    fill(color);
    add(`BT /F${bold?2:1} ${size.toFixed(1)} Tf 1 0 0 1 ${x.toFixed(2)} ${(H-y).toFixed(2)} Tm (${pdfString(v)}) Tj ET`);
  }
  function limit(text,max=90){let t=String(text??'').replace(/\s+/g,' ').trim();return t.length>max?t.slice(0,max-1)+'...':t}
  function wrap(str,maxChars=75){
    const words=String(str??'').replace(/\s+/g,' ').trim().split(' ');
    let out=[],s='';
    for(let word of words){
      if(word.length>maxChars){if(s){out.push(s);s=''}while(word.length>maxChars){out.push(word.slice(0,maxChars));word=word.slice(maxChars)}}
      const check=(s?s+' ':'')+word;
      if(check.length>maxChars&&s){out.push(s);s=word}else s=check;
    }
    if(s)out.push(s);
    return out.length?out:[''];
  }
  function money(v){return 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function shortNum(v){return String(v||'').replace(/[^0-9A-Za-z-]/g,'').padStart(6,'0')}
  function datePt(v){const d=String(v||today()).slice(0,10);return /^\d{4}-\d\d-\d\d$/.test(d)?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):d}
  const num=shortNum(q.number),date=datePt(q.date),validity=Math.min(365,Math.max(1,Number(st.quoteValidity)||15));
  const items=(q.items||[]).map(i=>({...i,qty:Number(i.qty)||0,price:Number(i.price)||0}));
  const amount=totalQuote(q);
  const pageTitle='ORÇAMENTO COMERCIAL';
  function beginPage(next=false){
    cmds=[];
    rect(0,0,W,H,white);rect(0,0,W,139,navy);
    poly([[W-136,0],[W,0],[W,139],[W-82,139]],blue);
    poly([[W-52,0],[W,0],[W,139],[W-7,139]],[.03,.34,.67]);
    rect(0,136,W,4,gold);rect(31,26,77,71,[.075,.27,.45]);
    tx('T',36,85,56,true,white);tx('R',67,85,54,true,[.18,.68,1]);
    poly([[73,47],[63,66],[72,66],[66,86],[89,58],[78,58],[84,47]],gold);
    tx('THIAGO',122,61,27,true,white);tx('REIS',240,61,27,true,[.20,.66,1]);
    tx('SERVIÇOS ELÉTRICOS & CÂMERAS',123,82,10.2,true,white);
    const caps=['ELÉTRICA PREDIAL','CFTV E CÂMERAS','REDES E INTERNET','MANUTENÇÃO'];
    caps.forEach((t,i)=>{const x=32+i*137;rect(x,102,127,22,[.08,.19,.29]);tx(t,x+7,117,8.05,true,white)});
    if(next)tx(pageTitle+' • CONTINUAÇÃO',33,166,10,true,ink);
  }
  function section(title,y){rect(32,y-16,W-64,25,pale);rect(32,y-16,3.5,25,blue);tx(title,44,y,10,true,navy)}
  function footer(pageNo){ln(32,808,W-32,808,line,1);tx('THIAGO REIS  •  ELÉTRICA PREDIAL, CÂMERAS E MANUTENÇÃO',34,824,8.2,true,navy);tx('Página '+pageNo,523,824,8,false,muted)}
  function endPage(){footer(pages.length+1);pages.push(cmds.join('\n')+'\n')}
  beginPage(false);
  tx(limit(st.company||'Thiago Reis',45).toUpperCase(),33,162,13,true,navy);
  tx('CNPJ: '+(st.cnpj||'Não informado'),33,180,10,true,ink);
  tx('WhatsApp: '+(st.phone||'Não informado'),33,195,9.5,false,muted);
  tx(limit(st.address||st.city||'Iacanga - SP e região',65),33,209,9,false,muted);
  if(st.email)tx(limit(st.email,52),33,221,8.6,false,muted);
  rect(382,152,181,76,pale,line);rect(382,152,181,26,navy);
  tx(pageTitle,393,170,12,true,white);tx('Emissão: '+date,393,194,9.2,false,ink);
  tx('Validade: '+validity+' dias',393,211,9.2,false,ink);
  section('DADOS DO CLIENTE',252);
  tx('CLIENTE',38,274,8,true,muted);tx(limit(cl.name||'Não informado',54),38,290,11,true,ink);
  tx('CPF / CNPJ',329,274,8,true,muted);tx(limit(cl.document||'Não informado',24),329,290,9.8,false,ink);
  tx('TELEFONE: '+(cl.phone||'Não informado'),38,308,9.2,false,ink);
  tx('ENDEREÇO: '+limit(cl.address||'Não informado',79),38,323,9.2,false,ink);
  section('SERVIÇOS E MATERIAIS',350);
  tx(limit(q.title||'Serviços elétricos e segurança eletrônica',88),39,373,10.2,true,ink);
  let y=388;
  function tableHead(){
    rect(32,y,W-64,25,navy);
    tx('ITEM',40,y+17,8.3,true,white);tx('DESCRIÇÃO',84,y+17,8.3,true,white);
    tx('QTD.',355,y+17,8.3,true,white);tx('UNIT.',423,y+17,8.3,true,white);
    tx('TOTAL',501,y+17,8.3,true,white);y+=25;
  }
  tableHead();
  items.forEach((it,i)=>{
    const desc=limit(it.desc||'Serviço / material',55),rows=wrap(desc,42),height=Math.max(25,15+rows.length*11);
    if(y+height>688){endPage();beginPage(true);y=190;tableHead();}
    rect(32,y,W-64,height,(i%2?white:[.966,.976,.992]),line);
    tx(String(i+1).padStart(2,'0'),40,y+17,9.2,false,ink);
    rows.forEach((a,j)=>tx(a,84,y+16+j*11,9.3,false,ink));
    tx(String(it.qty).replace('.',','),355,y+17,9.2,false,ink);
    tx(money(it.price),412,y+17,9,false,ink);tx(money(it.qty*it.price),489,y+17,9,true,navy);
    y+=height;
  });
  if(y+137>793){endPage();beginPage(true);y=186}
  y+=12;
  if(Number(q.discount)>0){tx('Desconto concedido: '+money(q.discount),337,y+8,9.3,false,muted);y+=17}
  rect(32,y,W-64,41,navy);
  tx('TOTAL DO ORÇAMENTO',43,y+26,12.5,true,white);tx(money(amount),415,y+27,18,true,gold);
  y+=57;
  const remarks=[String(q.notes||'').trim(),String(st.documentNotes||'').trim()].filter(Boolean);
  section('CONDIÇÕES E OBSERVAÇÕES',y+12);y+=32;
  tx('Validade: '+validity+' dias   •   Prazo de execução: a combinar',38,y,9.2,false,ink);y+=15;
  tx('Forma de pagamento: a combinar   •   Materiais e deslocamento conforme itens',38,y,9.2,false,ink);y+=15;
  for(const note of remarks.slice(0,3)){
    for(const row of wrap(note,94).slice(0,4)){
      if(y>785){endPage();beginPage(true);y=190}
      tx('• '+row,38,y,8.9,false,ink);y+=13;
    }
  }
  if(y+35<794){y+=14;ln(328,y,559,y,ink,.8);tx(limit(st.company||'Thiago Reis',40),332,y+14,9,true,navy)}
  endPage();
  const objects=[];
  objects[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objects[2]=`<< /Type /Pages /Kids [${pages.map((_,i)=>`${5+i*2} 0 R`).join(' ')}] /Count ${pages.length} >>`;
  objects[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objects[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  pages.forEach((c,i)=>{const idx=5+i*2;
    objects[idx]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${idx+1} 0 R >>`;
    objects[idx+1]=`<< /Length ${c.length} >>\nstream\n${c}endstream`;
  });
  let pdf='%PDF-1.4\n% THIAGO REIS DOCUMENTOS\n',offsets=[0];

  const xref=pdf.length;

  pdf+=`trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return {blob:new Blob([pdf],{type:'application/pdf'}),filename:'Orcamento_Thiago_Reis.pdf'};
}
function downloadQuote(id){
 const q=db.quotes.find(x=>x.id===id);if(!q)return;
 const f=makeQuotePDF(q),a=document.createElement('a'),url=URL.createObjectURL(f.blob);
 a.href=url;a.download=f.filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
 notify('PDF gerado. Confira seus downloads.');
}
async function shareQuote(id){
 const q=db.quotes.find(x=>x.id===id);if(!q)return;
 const f=makeQuotePDF(q),file=new File([f.blob],f.filename,{type:'application/pdf'});
 const name=(C(q.clientId)||{}).name||'cliente';
 if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
  try{await navigator.share({files:[file],title:'Orçamento - Thiago Reis',text:'Olá! Segue o orçamento em PDF para '+name+'.'});notify('PDF compartilhado.');return}
  catch(err){if(err&&err.name==='AbortError')return;console.warn(err)}
 }
 downloadQuote(id);
 notify('PDF baixado! No WhatsApp, anexe-o como Documento para o cliente.');
}
async function convertQuote(id){const q=db.quotes.find(x=>x.id===id);if(!q||q.status!=='aprovado'||db.jobs.some(j=>j.quoteId===id))return;const labor=(q.items||[]).filter(i=>/m[aã]o de obra|instala[cç][aã]o|servi[cç]o/i.test(i.desc||'')).reduce((a,i)=>a+n(i.qty)*n(i.price),0);db.jobs.push({id:uid(),quoteId:id,clientId:q.clientId,desc:q.title,date:today(),status:'agendado',notes:q.notes||'',price:totalQuote(q),labor:Math.min(totalQuote(q),labor),rate:n(db.settings.commission),payStatus:'pendente'});if(await save()){page='servicos';draw();notify('Orçamento convertido em serviço!')}else{try{await loadDB();draw()}catch(_){}}}
function exportCSV(){let lines=[['Data','Tipo','Descrição','Forma','Valor (R$)']];for(const x of db.incomes.filter(x=>String(x.date||'').startsWith(financeMonth)))lines.push([x.date,'Entrada',x.desc,x.method||'',n(x.amount).toFixed(2).replace('.',',')]);for(const x of db.expenses.filter(x=>String(x.date||'').startsWith(financeMonth)))lines.push([x.date,'Despesa',x.desc||x.category,x.method||'',n(x.amount).toFixed(2).replace('.',',')]);const csv='\uFEFF'+lines.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='thiago-reis-financeiro-'+financeMonth+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}


function catalog(){const arr=[...db.catalog].sort((a,b)=>a.category.localeCompare(b.category,'pt-BR')||a.name.localeCompare(b.name,'pt-BR'));let priced=arr.filter(x=>x.price!==null).length;return `<div class="hero-line"><div><div class="eyebrow">SEU CATÁLOGO DE SERVIÇOS</div><h2>Preços definidos por você</h2><p>Configure uma vez. Depois, escolha os serviços no orçamento e o valor entra automaticamente.</p></div><button class="btn" data-new="catalog">+ Cadastrar serviço</button></div><div class="grid4 sectionTitle"><div class="card metric"><div class="caption">Serviços cadastrados</div><strong>${arr.length}</strong></div><div class="card metric green"><div class="caption">Com preço definido</div><strong>${priced}</strong></div><div class="card metric"><div class="caption">Aguardando preço</div><strong>${arr.length-priced}</strong></div><div class="card metric"><div class="caption">Categorias</div><strong>${new Set(arr.map(x=>x.category)).size}</strong></div></div><div class="card tableWrap"><table class="table"><thead><tr><th>Serviço</th><th>Categoria</th><th>Preço</th><th>Unidade</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td class="wide"><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td>${x.price===null?'<span class="tag yellow">Defina o preço</span>':`<b>${M(x.price)}</b>`}</td><td>${esc(x.unit)}</td><td><button class="btn sm out" data-edit="catalog:${esc(x.id)}">✎ Editar</button></td></tr>`).join('')}</tbody></table></div><div class="notice">Os serviços vêm cadastrados sem preços fictícios. Só os que você precificar poderão ser escolhidos automaticamente no orçamento. Você também pode incluir serviços novos.</div>`}
function months6(){const d=new Date();return Array.from({length:6},(_,i)=>{const t=new Date(d.getFullYear(),d.getMonth()-5+i,1);return {key:t.toISOString().slice(0,7),label:t.toLocaleString('pt-BR',{month:'short'}).replace('.','')}})}
function chartHTML(){if(!isOwner())return `<p class="muted" style="margin-top:15px">Informações financeiras disponíveis apenas para o proprietário.</p>`;const months=months6(),v=months.map(m=>({...m,income:db.incomes.filter(x=>String(x.date).startsWith(m.key)).reduce((a,x)=>a+n(x.amount),0),expense:db.expenses.filter(x=>String(x.date).startsWith(m.key)).reduce((a,x)=>a+n(x.amount),0)}));const max=Math.max(1,...v.map(x=>Math.max(x.income,x.expense)));return `<div class="chart"><div class="chart-bars">${v.map(x=>`<div class="chart-col"><div class="chart-pair" title="${esc(x.label)}: entradas ${M(x.income)}; despesas ${M(x.expense)}"><span class="chart-bar in" style="height:${Math.max(1,x.income/max*100)}%"></span><span class="chart-bar outgo" style="height:${Math.max(1,x.expense/max*100)}%"></span></div><small>${esc(x.label)}</small></div>`).join('')}</div><div class="legend"><span><i class="leg-in"></i> Entradas</span><span><i class="leg-out"></i> Gastos</span><span>Valores dos seus lançamentos</span></div></div>`}
function toolsPage(){return `<div class="hero-line"><div><div class="eyebrow">CENTRAL TÉCNICA</div><h2>Ferramentas de elétrica & CFTV</h2><p>Calculadoras rápidas para planejamento e atendimento ao cliente.</p></div><span class="tech-icon">⚡</span></div><div class="tool-grid"><div class="card tool-card"><div class="tool-icon">⚡</div><h3>Potência elétrica</h3><p>Calcule a potência aparente pela tensão e corrente (V × A).</p><div class="fieldGrid"><label>Tensão (V)<input id="techVolt" type="number" min="0" step="any" placeholder="127 ou 220"></label><label>Corrente (A)<input id="techAmp" type="number" min="0" step="any" placeholder="10"></label></div><div class="tech-result" id="powerResult">Preencha os campos para calcular</div></div><div class="card tool-card"><div class="tool-icon">◉</div><h3>Armazenamento CFTV</h3><p>Estimativa com taxa média de dados informada por câmera.</p><div class="fieldGrid"><label>Câmeras<input id="techCams" type="number" min="1" step="1" placeholder="4"></label><label>Bitrate por câmera (Mb/s)<input id="techBitrate" type="number" min="0" step="any" placeholder="2"></label><label>Dias de gravação<input id="techDays" type="number" min="1" step="1" placeholder="15"></label><label>Horas gravadas / dia<input id="techHours" type="number" min="1" max="24" step="any" value="24"></label></div><div class="tech-result" id="storageResult">Preencha os campos para calcular</div></div><div class="card tool-card"><div class="tool-icon">▥</div><h3>Consumo de energia</h3><p>Estimativa teórica mensal por potência e tempo de uso.</p><div class="fieldGrid"><label>Potência (W)<input id="techWatts" type="number" min="0" step="any" placeholder="1500"></label><label>Horas por dia<input id="techUse" type="number" min="0" step="any" placeholder="2"></label><label>Dias por mês<input id="techUseDays" type="number" min="1" step="1" value="30"></label><label>Tarifa (R$/kWh)<input id="techTariff" type="number" min="0" step="any" placeholder="0,90"></label></div><div class="tech-result" id="energyResult">Preencha os campos para calcular</div></div><div class="card tool-card"><div class="tool-icon">⌘</div><h3>Checklist de atendimento</h3><div class="checklist"><label><input type="checkbox"> Desligamento e bloqueio quando necessário</label><label><input type="checkbox"> Confirmação da ausência de tensão</label><label><input type="checkbox"> Equipamento e EPI adequados</label><label><input type="checkbox"> Etiquetas e identificação do circuito</label><label><input type="checkbox"> Foto e registro do serviço</label><label><input type="checkbox"> Testes e entrega ao cliente</label></div></div></div><div class="notice">⚠ Ferramentas de apoio: os resultados são teóricos e não substituem projeto, medição em campo ou normas aplicáveis (NBR 5410 e NR-10). Nunca dimensione proteção e condutores apenas por esses cálculos.</div>`}
function bindTech(){const ids=['techVolt','techAmp','techCams','techBitrate','techDays','techHours','techWatts','techUse','techUseDays','techTariff'];const calc=()=>{let val=id=>{const v=document.getElementById(id)?.value||'';return v?Number(v.replace(',','.')):NaN};let v=val('techVolt'),a=val('techAmp');const power=document.getElementById('powerResult');if(power)power.textContent=v>=0&&a>=0?`Potência aparente: ${(v*a).toLocaleString('pt-BR',{maximumFractionDigits:2})} VA`:'Preencha tensão e corrente';let cams=val('techCams'),bit=val('techBitrate'),days=val('techDays'),hours=val('techHours');const storage=document.getElementById('storageResult');if(storage)storage.textContent=cams>0&&bit>0&&days>0&&hours>0?`Estimativa: ${(cams*bit*3600*hours*days/8/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})} TB (decimal)`:'Informe câmeras, bitrate e dias';let watts=val('techWatts'),use=val('techUse'),useDays=val('techUseDays'),tariff=val('techTariff');const result=document.getElementById('energyResult');if(result)result.textContent=watts>=0&&use>=0&&useDays>0?`${(watts*use*useDays/1000).toLocaleString('pt-BR',{maximumFractionDigits:2})} kWh / mês${tariff>=0?'  •  '+M(watts*use*useDays/1000*tariff):''}`:'Informe potência e tempo';};ids.forEach(id=>document.getElementById(id)?.addEventListener('input',calc));calc()}
function bindMain(){
 document.getElementById('backupExport')?.addEventListener('click',()=>{
   const obj=readLocal();if(!obj)return;
   const exported={format:'THIAGO-REIS-PRO-V4',createdAt:new Date().toISOString(),data:obj.data};
   const url=URL.createObjectURL(new Blob([JSON.stringify(exported,null,2)],{type:'application/json'}));
   const a=document.createElement('a');a.href=url;a.download='Thiago_Reis_backup_'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 });
 document.getElementById('backupImport')?.addEventListener('click',()=>document.getElementById('backupFile')?.click());
 document.getElementById('backupFile')?.addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  if(!confirm('Restaurar substitui os dados atuais deste aparelho. Continuar?'))return;
  try{const info=JSON.parse(await file.text());if(info.format!=='THIAGO-REIS-PRO-V4'||!info.data||!Array.isArray(info.data.clients)||!Array.isArray(info.data.quotes))throw new Error('Backup não reconhecido.');
    const record=readLocal();record.data=info.data;record.revision+=1;writeLocal(record);await loadDB();draw();notify('Backup restaurado com sucesso.');
  }catch(err){notify(err.message||'Erro ao importar backup')}
 });document.getElementById('moreMobile')?.addEventListener('click',showMore);document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{page=x.dataset.page;filter='';draw();window.scrollTo(0,0)});document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{page=x.dataset.go;filter='';draw()});document.querySelectorAll('[data-new]').forEach(x=>x.onclick=()=>{if(['quote','job'].includes(x.dataset.new)&&!db.clients.length){notify('Cadastre um cliente primeiro.');return openModal('client')}openModal(x.dataset.new)});document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{let [kind,id]=x.dataset.edit.split(':');openModal(kind,id)});document.querySelectorAll('[data-print]').forEach(x=>x.onclick=()=>printQuote(x.dataset.print));document.querySelectorAll('[data-pdf]').forEach(x=>x.onclick=()=>downloadQuote(x.dataset.pdf));document.querySelectorAll('[data-pdfservice]').forEach(x=>x.onclick=()=>printService(x.dataset.pdfservice));document.querySelectorAll('[data-share]').forEach(x=>x.onclick=()=>shareQuote(x.dataset.share));document.querySelectorAll('[data-convert]').forEach(x=>x.onclick=()=>convertQuote(x.dataset.convert));document.querySelectorAll('[data-paid]').forEach(x=>x.onclick=()=>quickPaid(x.dataset.paid));document.getElementById('logout').onclick=async()=>{try{await requestJSON('/logout','POST',{})}catch(e){}current=null;draw()};document.getElementById('search')?.addEventListener('input',e=>{let pos=e.target.selectionStart;filter=e.target.value;let elem=document.activeElement;const holder=elem.parentElement.parentElement;const wrap=holder.parentElement; // avoid re-render while typing; filter table rows locally
wrap.querySelectorAll('tbody tr').forEach(tr=>{tr.hidden=!tr.textContent.toLowerCase().includes(filter.toLowerCase())});});if(page==='ajustes')bindSettings();if(page==='ferramentas')bindTech();document.getElementById('financeMonth')?.addEventListener('change',e=>{financeMonth=e.target.value||today().slice(0,7);draw()});document.getElementById('exportCSV')?.addEventListener('click',exportCSV)}
function bindSettings(){document.getElementById('settingsForm').onsubmit=async e=>{e.preventDefault();let r=Object.fromEntries(new FormData(e.target));db.settings.company=r.company;db.settings.phone=r.phone;db.settings.city=r.city;db.settings.cnpj=r.cnpj||'';db.settings.legalName=r.legalName||'';db.settings.address=r.address||'';db.settings.email=r.email||'';db.settings.documentNotes=r.documentNotes||'';db.settings.quoteValidity=n(r.quoteValidity)||15;db.settings.commission=Math.min(100,n(r.commission));if(await save()){draw();notify('Dados atualizados.')}else{try{await loadDB();draw()}catch(_){}}};document.getElementById('passwordForm').onsubmit=async e=>{e.preventDefault();const r=Object.fromEntries(new FormData(e.target));if(r.ownerPin&&r.ownerPin.length<6||r.employeePin&&r.employeePin.length<6)return notify('Mínimo 6 caracteres por senha.');if(!r.ownerPin&&!r.employeePin)return notify('Digite uma nova senha.');if(r.ownerPin&&r.employeePin&&r.ownerPin===r.employeePin)return notify('Use senhas diferentes.');try{const out=await requestJSON('/passwords','PUT',r);e.target.reset();notify('Senhas alteradas.');if(out.relogin){current=null;setTimeout(bootstrap,500)}}catch(err){notify(err.message)}};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='thiago-reis-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};document.getElementById('restore').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data.settings||!['clients','quotes','jobs','expenses','incomes'].every(x=>Array.isArray(data[x])))throw Error();if(!confirm('Substituir TODOS os dados atuais do servidor pelo backup?'))return;db=data;if(await save()){draw();notify('Backup restaurado. Confira os dados.')}else{try{await loadDB();draw()}catch(_){}}}catch(err){notify('Arquivo de backup inválido.')}}}
window.addEventListener('error',e=>{console.error(e.error)});bootstrap();window.addEventListener('focus',async()=>{if(!current||modal)return;await syncQueue;try{await loadDB();draw()}catch(e){}});

})();
