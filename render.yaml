# Thiago Reis PRO — implantação Web + PostgreSQL pelo Render.
# IMPORTANTE: banco free expira 30 dias após criado. Faça upgrade/backups antes disso.
services:
  - type: web
    name: thiago-reis-pro-web
    runtime: docker
    repo: https://github.com/Thiagoreis22-ai/teste
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: thiago-reis-pro-db
          property: connectionString
      - key: SETUP_TOKEN
        generateValue: true
databases:
  - name: thiago-reis-pro-db
    plan: free
    databaseName: thiago_reis_pro
    user: thiago_reis_app
    ipAllowList: []
